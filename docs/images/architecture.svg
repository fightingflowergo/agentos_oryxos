<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560" role="img" aria-labelledby="title desc">
<title id="title">OryxOS 单机运行时目标架构</title>
<desc id="desc">CLI、REST API 与定时任务进入统一 AgentService。引擎由上下文组装、ReActLoop 与 ToolExecutor 组成，协调 Provider、Memory 和工具能力。配置文件与 SQLite 提供底层状态。外部模型、MCP Server、业务与通知系统位于应用边界之外。本图描述目标设计，不代表功能已实现。</desc>
